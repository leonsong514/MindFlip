name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('apps/backend/requirements.lock', 'apps/backend/pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.lock
      - name: Lint and format check
        run: |
          python -m ruff check apps/backend
          python -m ruff format --check apps/backend
      - name: Run tests
        run: python -m pytest apps/backend/tests -q
      - name: Credential boundary
        run: python -m pytest apps/backend/tests/test_credentials.py -q

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Tests
        run: npm run test
      - name: Build frontend
        run: npm run build
