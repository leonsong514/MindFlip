[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindflip-backend"
version = "0.1.0"
description = "MindFlip Python Agent Runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [
  { name = "MindFlip" },
]
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
mindflip-backend = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"